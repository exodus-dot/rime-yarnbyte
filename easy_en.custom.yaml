# easy_en.custom.yaml —— rime-yarnbyte 整合版补丁（rime-fast-xhup 原项目没有此文件）
# encoding: utf-8
#
# 只做一件事：把继承来源从 crane 的 default.yaml 改为 flypy_preset.yaml，
# 避免 crane 的「- = 翻页」等全局按键绑定影响英文方案。
---

patch:
  key_binder/+:
    import_preset: flypy_preset
  recognizer/+:
    import_preset: flypy_preset

  # [yarnbyte 用户偏好] 候选排序固定，不按输入习惯动态调频：关闭用户词典（想恢复删掉下一行）
  translator/enable_user_dict: false

  # [yarnbyte 用户偏好] 仅 Easy English 方案：英文候选按词频重排（常用词在前）。
  # 词频表 lua/easy_en_rank.txt 由 tools/gen-easy-en-rank.ps1 生成；不需要时删掉下面两项。
  # 其他方案（飞鹤快拼等）不挂载此过滤器，排序不变。
  engine/filters/+:
    - lua_filter@*easy_en_rank

  # [yarnbyte] 已改用 BlindingDark/rime-easy-en 原版方案。原版分词依赖 wordninja 外部程序，
  # Windows 上没装会初始化失败，所以改用 lua/easy_en_enhance.lua 里内置的纯 Lua 拆词（读 lua/easy_en_rank.txt）。
  # 连续敲 helloworld 时，第一候选是拆好并补空格的 "hello world "。
  easy_en/split_sentence: true
  easy_en/use_builtin_split: true

  # [yarnbyte] 原版选词会自动补尾部空格；候选高亮时按下面这些标点，则去掉空格并直接跟标点上屏。
  # 想改标点集合就改这个字符串；不需要此功能就删掉本项和下一项。
  easy_en/no_space_punct: ',.;:?!)]}"'
  engine/processors/@before 0: lua_processor@*easy_en_punct
