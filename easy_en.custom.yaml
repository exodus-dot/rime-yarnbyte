# easy_en.custom.yaml —— rime-yarnbyte 整合版补丁（rime-fast-xhup 原项目没有此文件）
# encoding: utf-8
#
# 只做一件事：把继承来源从 crane 的 default.yaml 改为 flypy_preset.yaml，
# 避免 crane 的「- = 翻页」等全局按键绑定影响英文方案。
---

patch:
  key_binder/+:
    import_preset: flypy_preset
  recognizer/+:
    import_preset: flypy_preset

  # [yarnbyte 用户偏好] 候选排序固定，不按输入习惯动态调频：关闭用户词典（想恢复删掉下一行）
  translator/enable_user_dict: false

  # [yarnbyte 用户偏好] 仅 Easy English 方案：英文候选按词频重排（常用词在前）。
  # 词频表 lua/easy_en_rank.txt 由 tools/gen-easy-en-rank.ps1 生成；不需要时删掉下面两项。
  # 其他方案（飞鹤快拼等）不挂载此过滤器，排序不变。
  engine/filters/+:
    - lua_filter@*easy_en_rank

  # [yarnbyte] 已改用 BlindingDark/rime-easy-en 原版方案。原版的分词功能默认依赖 wordninja 原生库，
  # Windows 上没装会让 enhance_filter 初始化失败，故关闭；装好 wordninja.dll 后可改回 true。
  easy_en/split_sentence: false
